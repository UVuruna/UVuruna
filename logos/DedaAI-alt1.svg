<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="dd-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D387"/>
      <stop offset="1" stop-color="#C9862B"/>
    </linearGradient>
  </defs>
  <!-- card -->
  <rect x="8" y="8" width="240" height="240" rx="40" fill="#141A24"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="39.25" fill="none" stroke="#F6D387" stroke-opacity="0.28" stroke-width="1.5"/>
  <!-- sound waves, upper right -->
  <path d="M 146,58 A 18 18 0 0 1 182,58" fill="none" stroke="url(#dd-gold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 134,66 A 30 30 0 0 1 194,66" fill="none" stroke="url(#dd-gold)" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <!-- "D" monogram: solid silhouette with a punched-out counter -->
  <rect x="60" y="64" width="120" height="128" rx="40" fill="url(#dd-gold)"/>
  <rect x="110" y="92" width="58" height="72" rx="26" fill="#141A24"/>
</svg>
